<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #ffffff;
        --text: #1a1a1a;
        --text-muted: #888888;
        --text-soft: #555555;
        --accent: #006fcf;
        --accent-soft: #eef5fc;
        --accent-border: #cfe2f5;
        --surface: #f4f8fc;
        --surface-border: #e2edf7;
        --hr: #eeeeee;
        --item-border: #f2f2f2;
        --slider-off: #cccccc;
        --knob: #ffffff;
        --banner-bg: #fff8e1;
        --banner-border: #f0e0a8;
        --banner-text: #7a5c00;
        --banner-text-strong: #5a4400;
        --scroll-thumb: #c3ccd6;
        --scroll-thumb-hover: #a8b3bf;
        --added-bg: #e3f3e7;
        --added-text: #2e7d3a;
      }
      [data-theme="dark"] {
        --bg: #2a3240;
        --text: #e8eef7;
        --text-muted: #93a3ba;
        --text-soft: #bcc8d8;
        --accent: #5aa9ee;
        --accent-soft: #333d4e;
        --accent-border: #3f4b5e;
        --surface: #323b4b;
        --surface-border: #3f4b5e;
        --hr: #3a4455;
        --item-border: #384252;
        --slider-off: #4a566a;
        --knob: #e8eef7;
        --banner-bg: #3b3a22;
        --banner-border: #5a5426;
        --banner-text: #e8d08a;
        --banner-text-strong: #f5e6b0;
        --scroll-thumb: #4a566a;
        --scroll-thumb-hover: #5a6980;
        --added-bg: #26382b;
        --added-text: #6bbf7a;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #2a3240;
          --text: #e8eef7;
          --text-muted: #93a3ba;
          --text-soft: #bcc8d8;
          --accent: #5aa9ee;
          --accent-soft: #333d4e;
          --accent-border: #3f4b5e;
          --surface: #323b4b;
          --surface-border: #3f4b5e;
          --hr: #3a4455;
          --item-border: #384252;
          --slider-off: #4a566a;
          --knob: #e8eef7;
          --banner-bg: #3b3a22;
          --banner-border: #5a5426;
          --banner-text: #e8d08a;
          --banner-text-strong: #f5e6b0;
          --scroll-thumb: #4a566a;
          --scroll-thumb-hover: #5a6980;
          --added-bg: #26382b;
          --added-text: #6bbf7a;
        }
      }
      body {
        width: 280px;
        margin: 0;
        font-family: -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      /* Themed scrollbars (Firefox) */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--scroll-thumb) transparent;
      }
      /* Themed scrollbars (Chromium) */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb);
        border-radius: 6px;
        border: 2px solid var(--bg);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scroll-thumb-hover);
      }
      header {
        background: #006fcf;
        color: #fff;
        padding: 12px 14px;
        font-weight: 600;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .theme-btn {
        background: rgba(255, 255, 255, 0.18);
        border: 0;
        color: #fff;
        font-size: 13px;
        border-radius: 6px;
        padding: 3px 8px;
        cursor: pointer;
        line-height: 1;
      }
      .body {
        padding: 14px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 44px;
        height: 24px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: var(--slider-off);
        transition: 0.2s;
        border-radius: 24px;
      }
      .slider:before {
        content: "";
        position: absolute;
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background: var(--knob);
        transition: 0.2s;
        border-radius: 50%;
      }
      input:checked + .slider {
        background: #006fcf;
      }
      input:checked + .slider:before {
        transform: translateX(20px);
      }
      button.run {
        width: 100%;
        padding: 9px;
        border: 1px solid var(--accent-border);
        border-radius: 6px;
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
        cursor: pointer;
        transition: box-shadow 0.15s ease;
      }
      button.run:hover:not(:disabled) {
        box-shadow: 0 2px 8px rgba(0, 111, 207, 0.18);
      }
      button.run:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .status {
        font-size: 12px;
        margin-top: 8px;
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 5px;
        background: #bbb;
      }
      .dot.on {
        background: #2e9b3f;
      }
      .dot.run {
        background: #e8a400;
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      .hint {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 8px;
      }
      .update-banner {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: var(--banner-bg);
        border-bottom: 1px solid var(--banner-border);
        color: var(--banner-text);
        padding: 10px 14px;
        font-size: 12px;
      }
      .update-banner b {
        color: var(--banner-text-strong);
      }
      .update-banner a,
      .update-banner button {
        flex: none;
        background: #e8a400;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        padding: 5px 10px;
        border-radius: 6px;
        font-size: 12px;
        border: 0;
        cursor: pointer;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--hr);
        margin: 14px 0 12px;
      }
      .section-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
        margin-bottom: 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        gap: 6px;
        text-align: center;
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--surface-border);
        border-radius: 8px;
        padding: 8px 4px;
      }
      .stat .n {
        font-size: 18px;
        font-weight: 700;
        color: var(--accent);
        line-height: 1;
      }
      .stat .l {
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 4px;
      }
      .last {
        font-size: 12px;
        color: var(--text-soft);
        margin-top: 12px;
      }
      .last b {
        color: var(--text);
      }
      .recent {
        margin-top: 10px;
        max-height: 120px;
        overflow-y: auto;
      }
      .recent .item {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--text-soft);
        padding: 4px 0;
        border-bottom: 1px solid var(--item-border);
        gap: 8px;
      }
      .recent .item .m {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .recent .item .when {
        color: var(--text-muted);
        flex-shrink: 0;
      }
      .recent-row {
        cursor: pointer;
      }
      .recent-row:hover .m {
        color: var(--accent);
      }
      .recent-details {
        display: none;
        font-size: 12px;
        color: var(--text-soft);
        line-height: 1.4;
        padding: 2px 0 8px;
        border-bottom: 1px solid var(--item-border);
      }
      .recent-item.open .recent-details {
        display: block;
      }
      .recent-details .meta {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 4px;
      }
      .empty {
        font-size: 11px;
        color: var(--text-muted);
        padding: 6px 0;
      }
      .section-toggle {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        border-radius: 8px;
        padding: 10px 12px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: var(--accent);
        margin-bottom: 8px;
        transition: background 0.15s ease, box-shadow 0.15s ease;
      }
      .section-toggle:hover {
        box-shadow: 0 2px 8px rgba(0, 111, 207, 0.18);
      }
      .section-toggle .st-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .section-toggle .st-icon {
        font-size: 14px;
      }
      .section-toggle .st-count {
        font-weight: 700;
      }
      .section-toggle .chev {
        transition: transform 0.15s ease;
        font-size: 12px;
      }
      .section-toggle.open .chev {
        transform: rotate(90deg);
      }
      .search-input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--surface-border);
        background: var(--surface);
        color: var(--text);
        font-size: 13px;
        outline: none;
      }
      .search-input:focus {
        border-color: var(--accent);
      }
      .search-input::placeholder {
        color: var(--text-muted);
      }
      .search-results {
        margin-top: 8px;
        max-height: 200px;
        overflow-y: auto;
      }
      .offer {
        border: 1px solid var(--surface-border);
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 6px;
        cursor: pointer;
        background: var(--surface);
      }
      .offer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .offer-name {
        font-size: 13px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .offer-tag {
        flex: none;
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .offer-tag.added {
        background: var(--added-bg);
        color: var(--added-text);
      }
      .offer-tag.eligible {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .offer-details {
        display: none;
        margin-top: 6px;
        font-size: 12px;
        color: var(--text-soft);
        line-height: 1.4;
      }
      .offer.open .offer-details {
        display: block;
      }
      .offer-details .meta {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 5px;
      }
      .offer-link {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-top: 8px;
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 600;
        color: var(--accent);
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        border-radius: 6px;
        text-decoration: none;
      }
      .offer-link:hover {
        text-decoration: underline;
      }
      .offer-link::before {
        content: "🔗";
        font-size: 11px;
      }
      .search-count {
        font-size: 11px;
        color: var(--text-muted);
        margin: 2px 0 6px;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
      }
      .total {
        font-size: 11px;
        color: var(--text-muted);
      }
      .clear {
        font-size: 11px;
        color: #d9534f;
        background: none;
        border: 0;
        cursor: pointer;
        padding: 0;
      }
      .update-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .check-btn {
        flex: none;
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      .check-btn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .update-note {
        font-size: 11px;
        color: var(--text-muted);
      }
      .credit {
        text-align: center;
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 14px;
      }
      .credit b {
        color: var(--text-soft);
      }
      .credit a {
        color: var(--accent);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <span>Amex Offer Auto-Adder</span>
      <button class="theme-btn" id="themeBtn" title="Toggle theme">🌙</button>
    </header>
    <div class="update-banner" id="updateBanner">
      <span
        >Update available: <b id="updateVer">v?</b> — you have
        <span id="currentVer">?</span></span
      >
      <button id="updateLink" type="button">Download</button>
    </div>
    <div class="body">
      <div class="row">
        <span>Auto-add on visit</span>
        <label class="switch">
          <input type="checkbox" id="toggle" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="row">
        <span>Merchant offer heads-up</span>
        <label class="switch">
          <input type="checkbox" id="headsUpToggle" />
          <span class="slider"></span>
        </label>
      </div>
      <button class="run" id="runNow">Add offers now</button>
      <div class="status">
        <span class="dot" id="dot"></span><span id="statusText">Idle</span>
      </div>
      <div class="hint" id="hint">Open the Amex Offers page while logged in.</div>
      <div class="hint" id="cacheInfo"></div>

      <hr />

      <div class="section-title">Offers added</div>
      <div class="grid">
        <div class="stat"><div class="n" id="s-today">0</div><div class="l">Today</div></div>
        <div class="stat"><div class="n" id="s-week">0</div><div class="l">Week</div></div>
        <div class="stat"><div class="n" id="s-month">0</div><div class="l">Month</div></div>
        <div class="stat"><div class="n" id="s-all">0</div><div class="l">All time</div></div>
      </div>

      <hr />

      <button class="section-toggle" id="searchToggle" type="button">
        <span class="st-left">
          <span class="st-icon">🔍</span>
          <span>Search my offers</span>
          <span class="st-count" id="offerTotalCount"></span>
        </span>
        <span class="chev" id="searchChev">▸</span>
      </button>
      <div class="search-wrap" id="searchWrap" style="display: none">
        <input
          type="text"
          id="offerSearch"
          class="search-input"
          placeholder="Search merchants (e.g. Delta, Whole Foods)…"
          autocomplete="off"
        />
        <div class="search-results" id="offerResults"></div>
      </div>

      <hr />

      <div class="last">Last added: <b id="lastAdded">never</b></div>

      <div id="lastRunWrap" style="display:none">
        <div class="section-title" style="margin-top: 14px">Last run by card</div>
        <div class="recent" id="perCard"></div>
      </div>

      <div class="section-title" style="margin-top: 14px">Recent</div>
      <div class="recent" id="recent"></div>

      <div class="footer">
        <span class="total" id="total"></span>
        <button class="clear" id="clear">Clear history</button>
      </div>

      <hr />

      <div class="update-row">
        <button class="check-btn" id="checkUpdate">Check for updates</button>
        <span class="update-note" id="updateStatus">Auto-checks every 12 hours</span>
      </div>

      <div class="credit">
        by <b>Tyler Buza</b> ·
        <a href="https://buza.dev" target="_blank" rel="noopener">buza.dev</a>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
