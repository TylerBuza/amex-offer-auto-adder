<svg xmlns="http://www.w3.org/2000/svg" width="680" height="760" viewBox="0 0 680 760" role="img" aria-labelledby="title desc">
  <title id="title">Amex Offer Auto-Adder dashboard</title>
  <desc id="desc">A polished sample dashboard with generic offer totals and controls.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6fd"/>
      <stop offset="1" stop-color="#dceafb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#17324f" flood-opacity=".20"/>
    </filter>
  </defs>
  <rect width="680" height="760" rx="30" fill="url(#canvas)"/>
  <circle cx="56" cy="78" r="110" fill="#fff" opacity=".34"/>
  <circle cx="640" cy="716" r="155" fill="#b9d8f5" opacity=".42"/>
  <g transform="translate(90 34)" filter="url(#shadow)">
    <rect width="500" height="692" rx="20" fill="#2a3240"/>
    <path d="M20 0h460a20 20 0 0 1 20 20v58H0V20A20 20 0 0 1 20 0Z" fill="#006fcf"/>
    <text x="25" y="47" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Amex Offer Auto-Adder</text>
    <rect x="405" y="22" width="70" height="34" rx="10" fill="#fff" opacity=".18"/>
    <text x="440" y="44" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">AUTO</text>

    <text x="25" y="124" fill="#e8eef7" font-family="Segoe UI, Arial, sans-serif" font-size="19">Auto-add on visit</text>
    <rect x="416" y="97" width="60" height="34" rx="17" fill="#0b86e8"/>
    <circle cx="459" cy="114" r="14" fill="#e8eef7"/>
    <text x="25" y="176" fill="#e8eef7" font-family="Segoe UI, Arial, sans-serif" font-size="19">Merchant offer heads-up</text>
    <rect x="416" y="149" width="60" height="34" rx="17" fill="#0b86e8"/>
    <circle cx="459" cy="166" r="14" fill="#e8eef7"/>

    <rect x="25" y="207" width="450" height="54" rx="10" fill="#333d4e" stroke="#46536a"/>
    <text x="250" y="241" text-anchor="middle" fill="#5aa9ee" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Add offers now</text>
    <circle cx="31" cy="290" r="7" fill="#35b657"/>
    <text x="47" y="297" fill="#e8eef7" font-family="Segoe UI, Arial, sans-serif" font-size="17">Enabled</text>
    <text x="25" y="332" fill="#93a3ba" font-family="Segoe UI, Arial, sans-serif" font-size="15">Connected to American Express. Ready to add offers.</text>
    <text x="25" y="363" fill="#93a3ba" font-family="Segoe UI, Arial, sans-serif" font-size="15">312 merchant offers cached</text>
    <line x1="25" y1="390" x2="475" y2="390" stroke="#3a4455"/>

    <text x="25" y="424" fill="#93a3ba" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="1.4">OFFERS ADDED</text>
    <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
      <g transform="translate(25 443)">
        <rect width="102" height="92" rx="12" fill="#323b4b" stroke="#46536a"/>
        <text x="51" y="43" fill="#5aa9ee" font-size="27" font-weight="700">12</text>
        <text x="51" y="70" fill="#93a3ba" font-size="14">Today</text>
      </g>
      <g transform="translate(141 443)">
        <rect width="102" height="92" rx="12" fill="#323b4b" stroke="#46536a"/>
        <text x="51" y="43" fill="#5aa9ee" font-size="27" font-weight="700">38</text>
        <text x="51" y="70" fill="#93a3ba" font-size="14">Week</text>
      </g>
      <g transform="translate(257 443)">
        <rect width="102" height="92" rx="12" fill="#323b4b" stroke="#46536a"/>
        <text x="51" y="43" fill="#5aa9ee" font-size="27" font-weight="700">104</text>
        <text x="51" y="70" fill="#93a3ba" font-size="14">Month</text>
      </g>
      <g transform="translate(373 443)">
        <rect width="102" height="92" rx="12" fill="#323b4b" stroke="#46536a"/>
        <text x="51" y="43" fill="#5aa9ee" font-size="27" font-weight="700">312</text>
        <text x="51" y="70" fill="#93a3ba" font-size="14">All time</text>
      </g>
    </g>
    <line x1="25" y1="562" x2="475" y2="562" stroke="#3a4455"/>
    <rect x="25" y="587" width="450" height="72" rx="13" fill="#323b4b" stroke="#46536a"/>
    <circle cx="56" cy="623" r="11" fill="none" stroke="#5aa9ee" stroke-width="5"/>
    <line x1="64" y1="631" x2="73" y2="640" stroke="#5aa9ee" stroke-width="5" stroke-linecap="round"/>
    <text x="93" y="631" fill="#5aa9ee" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Search my offers (312)</text>
    <path d="M444 617l9 6-9 6Z" fill="#5aa9ee"/>
  </g>
