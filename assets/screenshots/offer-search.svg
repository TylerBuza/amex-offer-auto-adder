    <text x="487" y="70" text-anchor="end" fill="#93a3ba" font-family="Segoe UI, Arial, sans-serif" font-size="16">312</text>
    <rect x="24" y="116" width="496" height="58" rx="11" fill="#323b4b" stroke="#5aa9ee" stroke-width="2"/>
