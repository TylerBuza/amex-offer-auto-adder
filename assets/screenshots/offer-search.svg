<svg xmlns="http://www.w3.org/2000/svg" width="680" height="760" viewBox="0 0 680 760" role="img" aria-labelledby="title desc">
  <title id="title">Offer search results</title>
  <desc id="desc">A polished sample offer search using generic merchants and card information.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6fd"/>
      <stop offset="1" stop-color="#d9e9fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#17324f" flood-opacity=".20"/>
    </filter>
  </defs>
  <rect width="680" height="760" rx="30" fill="url(#canvas)"/>
  <circle cx="632" cy="78" r="125" fill="#fff" opacity=".34"/>
  <circle cx="48" cy="718" r="145" fill="#b9d8f5" opacity=".42"/>
  <g transform="translate(68 42)" filter="url(#shadow)">
