    <text x="24" y="207" fill="#93a3ba" font-family="Segoe UI, Arial, sans-serif" font-size="15">2 sample matches</text>

    <rect x="24" y="230" width="496" height="204" rx="14" fill="#323b4b" stroke="#46536a"/>
