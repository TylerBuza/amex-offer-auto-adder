    <rect x="416" y="247" width="82" height="31" rx="8" fill="#26382b"/>
    <text x="457" y="268" text-anchor="middle" fill="#6bbf7a" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">ADDED</text>
    <text x="45" y="308" fill="#bcc8d8" font-family="Segoe UI, Arial, sans-serif" font-size="17">Spend $50 or more, get $10 back.</text>
    <text x="45" y="341" fill="#93a3ba" font-family="Segoe UI, Arial, sans-serif" font-size="15">Card ending 1234 - Expires 12/31/26</text>
