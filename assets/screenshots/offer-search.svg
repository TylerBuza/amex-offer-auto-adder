    <path d="M67 388h9m-4.5-4.5 4.5 4.5-4.5 4.5" fill="none" stroke="#5aa9ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="91" y="394" fill="#5aa9ee" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">example.com</text>

    <rect x="24" y="452" width="496" height="190" rx="14" fill="#323b4b" stroke="#46536a"/>
    <text x="45" y="493" fill="#e8eef7" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Sample Roasters</text>
